services:
  postgres:
    image: postgres:15-alpine
    container_name: agent-cc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: agent_cc
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-cc

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-cc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres123@postgres:5432/agent_cc
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-cc

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent-cc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agent-cc

volumes:
  postgres_data:
    driver: local

networks:
  agent-cc:
    driver: bridge
